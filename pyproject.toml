[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI distribution, the GitHub repo, and the console script all share the "accelprof" name;
# the import packages stay descriptive (experiment_store / analysis_mcp).
name = "accelprof"
version = "0.1.0"
description = "Cross-accelerator (NVIDIA GPU / AWS Neuron) experiment store + profiling-analysis MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "littlemex" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: System :: Benchmark",
]
# Base install = the experiment_store library only. Ranges (not exact pins): a library must not
# dictate a single version to its consumers.
dependencies = [
  "mlflow-skinny>=3.1,<4",
  "boto3>=1.34",
]

[project.optional-dependencies]
# The analysis MCP server (opt-in, so a producer that only logs runs does not pull in the MCP stack).
mcp = ["mcp>=1.18,<2"]
# SigV4 auth for a SageMaker-managed MLflow. Not needed for a plain MLflow server.
sagemaker = ["sagemaker-mlflow>=0.5,<1"]
test = ["pytest", "moto"]

[project.scripts]
# Requires the [mcp] extra (the entry point errors with an install hint otherwise).
accelprof-analysis-mcp = "analysis_mcp.server:main"

[project.urls]
Homepage = "https://github.com/littlemex/accelprof"
Repository = "https://github.com/littlemex/accelprof"
Issues = "https://github.com/littlemex/accelprof/issues"

[tool.setuptools.packages.find]
# include sub-packages automatically (so e.g. experiment_store.* is never silently dropped);
# exclude tests from the wheel.
include = ["experiment_store*", "analysis_mcp*"]

[tool.setuptools.package-data]
"*" = []
